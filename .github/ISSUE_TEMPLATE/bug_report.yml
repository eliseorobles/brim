name: Bug report
description: Something in Brim doesn't work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Feature
      options:
        - Claude Code accounts
        - Memory
        - System monitor
        - Port Manager / Kill Process
        - Cleaner / Uninstaller
        - Homebrew / App Updates
        - Clipboard
        - Keep awake
        - Dynamic Island
        - Building from source
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Brim and macOS versions
      description: Brim's version is in Settings › About.
      placeholder: "Brim 3.4.4, macOS 26.1, MacBook Pro M3"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove email addresses, account names and anything else private before posting.
      render: text
