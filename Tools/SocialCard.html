<!doctype html>
<!--

  Copyright (C) 2026 Robles Consulting LLC

  Brim's social preview card (GitHub "Social preview", LinkedIn and other link
  previews): 1280 x 640. Render it to docs/assets/social-preview.png with
  headless Chrome, in a throwaway profile:

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
    --user-data-dir="$(mktemp -d)" --hide-scrollbars --force-device-scale-factor=1 \
    --window-size=1280,640 --screenshot=docs/assets/social-preview.png \
    "file://$PWD/Tools/SocialCard.html"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brim social card</title>
<style>
  :root {
    --top: #2E52DB;
    --bottom: #0DA8B3;
    --ink: #FFFFFF;
    --ink-soft: rgba(255, 255, 255, 0.84);
    --glass: rgba(255, 255, 255, 0.14);
    --glass-edge: rgba(255, 255, 255, 0.28);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(900px 520px at 88% 8%, rgba(255, 255, 255, 0.16), transparent 60%),
      linear-gradient(135deg, var(--top) 0%, #2470D0 45%, var(--bottom) 100%);
    position: relative;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    position: absolute;
    inset: 0;
    padding: 72px 88px;
    display: grid;
    grid-template-columns: 1fr 340px;
    column-gap: 56px;
    align-items: center;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px;
    border-radius: 999px;
    background: var(--glass);
    border: 1px solid var(--glass-edge);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .eyebrow i {
    width: 10px; height: 10px; border-radius: 50%;
    background: #7CF5D4;
    box-shadow: 0 0 0 4px rgba(124, 245, 212, 0.25);
  }
  h1 {
    margin-top: 26px;
    font-size: 112px;
    line-height: 0.95;
    font-weight: 800;
    letter-spacing: -0.035em;
  }
  .headline {
    margin-top: 22px;
    font-size: 40px;
    line-height: 1.16;
    font-weight: 650;
    letter-spacing: -0.015em;
    max-width: 700px;
  }
  .chips {
    margin-top: 30px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    max-width: 720px;
  }
  .chips span {
    padding: 8px 15px;
    border-radius: 10px;
    background: rgba(8, 22, 64, 0.28);
    border: 1px solid rgba(255, 255, 255, 0.18);
    font-size: 20px;
    font-weight: 560;
    color: var(--ink-soft);
  }
  .footer {
    position: absolute;
    left: 88px;
    right: 88px;
    bottom: 40px;
    display: flex;
    justify-content: space-between;
    font-size: 21px;
    font-weight: 560;
    color: var(--ink-soft);
  }
  .footer b { color: var(--ink); font-weight: 700; }
  .icon {
    width: 340px;
    height: 340px;
    border-radius: 82px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.08));
    border: 1.5px solid rgba(255, 255, 255, 0.36);
    box-shadow: 0 40px 80px rgba(6, 18, 60, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    display: grid;
    place-items: center;
    margin-top: -40px;
  }
  .icon svg { width: 250px; height: 250px; }
</style>
</head>
<body>
  <div class="card">
    <div>
      <span class="eyebrow"><i></i>Free &amp; open source · macOS menu bar app</span>
      <h1>Brim</h1>
      <p class="headline">Run several Claude Code accounts on one Mac, and keep it fast.</p>
      <div class="chips">
        <span>Claude Code accounts</span>
        <span>Memory cleanup</span>
        <span>System monitor</span>
        <span>Port Manager</span>
        <span>Cleaner &amp; Uninstaller</span>
        <span>Dynamic Island</span>
      </div>
    </div>
    <div class="icon" aria-hidden="true">
      <svg viewBox="212 280 600 460" xmlns="http://www.w3.org/2000/svg">
        <rect x="212" y="310" width="600" height="56" rx="28" fill="#FFFFFF"/>
        <path d="M262 410 H762 C762 580 652 710 512 710 C372 710 262 580 262 410 Z" fill="#FFFFFF"/>
      </svg>
    </div>
  </div>
  <div class="footer">
    <span><b>github.com/eliseorobles/brim</b></span>
    <span>Swift · GPL-3.0 · macOS 14+ · Apple Silicon</span>
  </div>
</body>
</html>
